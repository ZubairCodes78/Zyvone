<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0D0D0D"/>
  <rect x="15" y="15" width="770" height="420" rx="12" fill="#141414" stroke="#242424" stroke-width="1.5"/>
  
  <text x="45" y="55" fill="#C8ED35" font-family="monospace" font-size="12" font-weight="bold">SYSTEMS TEARDOWN // 01</text>
  <text x="45" y="85" fill="#F2F1EC" font-family="sans-serif" font-size="20" font-weight="600">Why Systems Beat Services: The Architecture of Leverage</text>

  <!-- Flow Chart: Services vs Systems -->
  <g transform="translate(45, 120)">
    <!-- Traditional Services Path (Linear) -->
    <rect x="0" y="0" width="220" height="80" rx="8" fill="#1A1A1A" stroke="#333333"/>
    <text x="110" y="35" fill="#9A9A9A" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">Linear Agency Hours</text>
    <text x="110" y="58" fill="#666666" font-family="monospace" font-size="11" text-anchor="middle">Input: 1h → Output: 1h</text>

    <line x1="220" y1="40" x2="260" y2="40" stroke="#444444" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="260" y="0" width="220" height="80" rx="8" fill="#1A1A1A" stroke="#333333"/>
    <text x="370" y="35" fill="#9A9A9A" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">Disposable Deliverable</text>
    <text x="370" y="58" fill="#666666" font-family="monospace" font-size="11" text-anchor="middle">Decays immediately</text>

    <line x1="480" y1="40" x2="520" y2="40" stroke="#444444" stroke-width="1.5" stroke-dasharray="4 4"/>

    <rect x="520" y="0" width="190" height="80" rx="8" fill="#221515" stroke="#442222"/>
    <text x="615" y="35" fill="#FF7884" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="600">Zero Leverage</text>
    <text x="615" y="58" fill="#AA5555" font-family="monospace" font-size="11" text-anchor="middle">Requires Re-Hiring</text>

    <!-- ZYVONE Software System Path (Compounding) -->
    <rect x="0" y="140" width="220" height="110" rx="8" fill="#152215" stroke="#254425"/>
    <text x="110" y="175" fill="#C8ED35" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Engineered System</text>
    <text x="110" y="200" fill="#A0CCA0" font-family="monospace" font-size="11" text-anchor="middle">Input: Architectural Capital</text>
    <text x="110" y="222" fill="#709970" font-family="monospace" font-size="10" text-anchor="middle">Automated Edge Pipeline</text>

    <line x1="220" y1="195" x2="260" y2="195" stroke="#C8ED35" stroke-width="2"/>

    <rect x="260" y="140" width="220" height="110" rx="8" fill="#152215" stroke="#254425"/>
    <text x="370" y="175" fill="#C8ED35" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Self-Running Asset</text>
    <text x="370" y="200" fill="#A0CCA0" font-family="monospace" font-size="11" text-anchor="middle">Zero marginal cost/run</text>
    <text x="370" y="222" fill="#709970" font-family="monospace" font-size="10" text-anchor="middle">99.99% Autonomous Uptime</text>

    <line x1="480" y1="195" x2="520" y2="195" stroke="#C8ED35" stroke-width="2"/>

    <rect x="520" y="140" width="190" height="110" rx="8" fill="#1C301C" stroke="#356635"/>
    <text x="615" y="175" fill="#C8ED35" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">Compounding ROI</text>
    <text x="615" y="200" fill="#E0FFE0" font-family="monospace" font-size="12" text-anchor="middle">Exponential Scale</text>
    <text x="615" y="222" fill="#88BB88" font-family="monospace" font-size="10" text-anchor="middle">Permanent Advantage</text>
  </g>
</svg>
