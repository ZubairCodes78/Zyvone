<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0D0D0D"/>
  <rect x="15" y="15" width="770" height="420" rx="12" fill="#141414" stroke="#242424" stroke-width="1.5"/>
  
  <text x="45" y="55" fill="#25D366" font-family="monospace" font-size="12" font-weight="bold">MESSAGING PIPELINES // 08</text>
  <text x="45" y="85" fill="#F2F1EC" font-family="sans-serif" font-size="20" font-weight="600">How WhatsApp Business Automation Works: Webhooks &amp; Meta API</text>

  <g transform="translate(45, 120)">
    <!-- Block 1: Event Trigger -->
    <rect x="0" y="0" width="155" height="115" rx="8" fill="#1A1A1A" stroke="#333333"/>
    <text x="77" y="35" fill="#F2F1EC" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">01 // ERP / DB</text>
    <text x="77" y="60" fill="#888888" font-family="monospace" font-size="10" text-anchor="middle">Order Placed /</text>
    <text x="77" y="78" fill="#888888" font-family="monospace" font-size="10" text-anchor="middle">Status Updated</text>
    <text x="77" y="98" fill="#25D366" font-family="monospace" font-size="10" text-anchor="middle">POST Webhook</text>

    <line x1="155" y1="57" x2="185" y2="57" stroke="#25D366" stroke-width="2"/>

    <!-- Block 2: Redis Message Queue -->
    <rect x="185" y="0" width="155" height="115" rx="8" fill="#1A1A1A" stroke="#333333"/>
    <text x="262" y="35" fill="#F2F1EC" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">02 // BullMQ Queue</text>
    <text x="262" y="60" fill="#888888" font-family="monospace" font-size="10" text-anchor="middle">Redis In-Memory</text>
    <text x="262" y="78" fill="#888888" font-family="monospace" font-size="10" text-anchor="middle">Rate Limiting 80 RPS</text>
    <text x="262" y="98" fill="#25D366" font-family="monospace" font-size="10" text-anchor="middle">Retry Backoff</text>

    <line x1="340" y1="57" x2="370" y2="57" stroke="#25D366" stroke-width="2"/>

    <!-- Block 3: Meta Cloud API -->
    <rect x="370" y="0" width="155" height="115" rx="8" fill="#152215" stroke="#255525"/>
    <text x="447" y="35" fill="#25D366" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">03 // Meta Cloud</text>
    <text x="447" y="60" fill="#A0CCA0" font-family="monospace" font-size="10" text-anchor="middle">HSM Template</text>
    <text x="447" y="78" fill="#A0CCA0" font-family="monospace" font-size="10" text-anchor="middle">Hydrated Variables</text>
    <text x="447" y="98" fill="#25D366" font-family="monospace" font-size="10" text-anchor="middle">Bearer Auth</text>

    <line x1="525" y1="57" x2="555" y2="57" stroke="#25D366" stroke-width="2"/>

    <!-- Block 4: Customer Device -->
    <rect x="555" y="0" width="155" height="115" rx="8" fill="#152215" stroke="#255525"/>
    <text x="632" y="35" fill="#25D366" font-family="sans-serif" font-size="12" text-anchor="middle" font-weight="bold">04 // Customer</text>
    <text x="632" y="60" fill="#A0CCA0" font-family="monospace" font-size="10" text-anchor="middle">Instant Delivery</text>
    <text x="632" y="78" fill="#A0CCA0" font-family="monospace" font-size="10" text-anchor="middle">Interactive Buttons</text>
    <text x="632" y="98" fill="#25D366" font-family="monospace" font-size="10" text-anchor="middle">98% Open Rate</text>

    <!-- Bottom Data Pipeline Details -->
    <rect x="0" y="145" width="710" height="100" rx="8" fill="#141E14" stroke="#224022"/>
    <text x="35" y="180" fill="#25D366" font-family="monospace" font-size="11" font-weight="bold">BIDIRECTIONAL STATUS &amp; CRM SYNCHRONIZATION</text>
    <text x="35" y="210" fill="#F2F1EC" font-family="sans-serif" font-size="13">Inbound Webhooks capture: Sent → Delivered → Read → Interactive Button Response</text>
    <text x="35" y="230" fill="#88CC88" font-family="monospace" font-size="11">Customer responses trigger instant database record state transitions with sub-100ms latency.</text>
  </g>
</svg>
