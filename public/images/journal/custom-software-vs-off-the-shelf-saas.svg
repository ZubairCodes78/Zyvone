<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0D0D0D"/>
  <rect x="15" y="15" width="770" height="420" rx="12" fill="#141414" stroke="#242424" stroke-width="1.5"/>
  
  <text x="45" y="55" fill="#C8ED35" font-family="monospace" font-size="12" font-weight="bold">SOFTWARE ECONOMICS // 07</text>
  <text x="45" y="85" fill="#F2F1EC" font-family="sans-serif" font-size="20" font-weight="600">Custom Software vs. Off-the-Shelf SaaS: The True Cost</text>

  <g transform="translate(45, 120)">
    <!-- SaaS Trap -->
    <rect x="0" y="0" width="340" height="245" rx="8" fill="#1F1515" stroke="#3D2525"/>
    <text x="30" y="40" fill="#FF8888" font-family="sans-serif" font-size="15" font-weight="bold">Off-the-Shelf SaaS Trap</text>
    <text x="30" y="65" fill="#AA5555" font-family="monospace" font-size="11">PER-SEAT SUBSCRIPTION DECAY</text>
    
    <text x="30" y="105" fill="#DDCCCC" font-family="sans-serif" font-size="13">✕ Compound licensing ($40–$150/user/mo)</text>
    <text x="30" y="135" fill="#DDCCCC" font-family="sans-serif" font-size="13">✕ Fragile 3rd-party Zapier sync chains</text>
    <text x="30" y="165" fill="#DDCCCC" font-family="sans-serif" font-size="13">✕ Zero competitive differentiation</text>
    <text x="30" y="210" fill="#FF8888" font-family="monospace" font-size="11">Year 3 Cost: $180,000+ | Equity Owned: $0</text>

    <!-- Owned Software Platform -->
    <rect x="370" y="0" width="340" height="245" rx="8" fill="#152215" stroke="#254425"/>
    <text x="400" y="40" fill="#C8ED35" font-family="sans-serif" font-size="15" font-weight="bold">Owned Custom System</text>
    <text x="400" y="65" fill="#A0CCA0" font-family="monospace" font-size="11">PERMANENT CAPITAL ASSET</text>
    
    <text x="400" y="105" fill="#F2F1EC" font-family="sans-serif" font-size="13">✓ Exact tailored workflow alignment</text>
    <text x="400" y="135" fill="#F2F1EC" font-family="sans-serif" font-size="13">✓ Unlimited users &amp; zero per-seat fees</text>
    <text x="400" y="165" fill="#F2F1EC" font-family="sans-serif" font-size="13">✓ Proprietary IP &amp; enterprise valuation</text>
    <text x="400" y="210" fill="#C8ED35" font-family="monospace" font-size="11">Maintenance: Fixed Cloud Infrastructure</text>
  </g>
</svg>
