<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0D0D0D"/>
  <rect x="15" y="15" width="770" height="420" rx="12" fill="#141414" stroke="#242424" stroke-width="1.5"/>
  
  <text x="45" y="55" fill="#C8ED35" font-family="monospace" font-size="12" font-weight="bold">SCALE &amp; LATENCY // 04</text>
  <text x="45" y="85" fill="#F2F1EC" font-family="sans-serif" font-size="20" font-weight="600">Building for Scale: Architecture Lessons from 100k+ Users</text>

  <!-- Scale / Distribution topology -->
  <g transform="translate(45, 120)">
    <!-- Global Edge Layer -->
    <rect x="0" y="0" width="710" height="70" rx="8" fill="#152415" stroke="#254425"/>
    <text x="25" y="32" fill="#C8ED35" font-family="monospace" font-size="11" font-weight="bold">VERCEL GLOBAL EDGE NETWORK (300+ POPS)</text>
    <text x="25" y="52" fill="#90B090" font-family="sans-serif" font-size="12">Sub-60ms TTFB · Automated Static Generation + Edge Cache Invalidation</text>
    <text x="685" y="42" fill="#C8ED35" font-family="monospace" font-size="14" font-weight="bold" text-anchor="end">99.99%</text>

    <!-- 3 Tier Blocks -->
    <rect x="0" y="85" width="225" height="120" rx="8" fill="#181818" stroke="#2A2A2A"/>
    <text x="20" y="115" fill="#AAAAAA" font-family="monospace" font-size="11" font-weight="bold">CLIENT EXECUTION</text>
    <text x="20" y="145" fill="#C8ED35" font-family="monospace" font-size="22" font-weight="bold">0 Server Load</text>
    <text x="20" y="175" fill="#777777" font-family="sans-serif" font-size="11">WASM &amp; Web Worker local tasks</text>

    <rect x="242" y="85" width="225" height="120" rx="8" fill="#181818" stroke="#2A2A2A"/>
    <text x="262" y="115" fill="#AAAAAA" font-family="monospace" font-size="11" font-weight="bold">CORE WEB VITALS</text>
    <text x="262" y="145" fill="#C8ED35" font-family="monospace" font-size="22" font-weight="bold">100 / 100</text>
    <text x="262" y="175" fill="#777777" font-family="sans-serif" font-size="11">0.1s LCP · 0ms Cumulative Shift</text>

    <rect x="485" y="85" width="225" height="120" rx="8" fill="#181818" stroke="#2A2A2A"/>
    <text x="505" y="115" fill="#AAAAAA" font-family="monospace" font-size="11" font-weight="bold">MONTHLY VOLUME</text>
    <text x="505" y="145" fill="#C8ED35" font-family="monospace" font-size="22" font-weight="bold">100k+ Reqs</text>
    <text x="505" y="175" fill="#777777" font-family="sans-serif" font-size="11">Zero latency degradation</text>

    <!-- Bottom summary banner -->
    <rect x="0" y="220" width="710" height="40" rx="6" fill="#141414" stroke="#222222"/>
    <text x="355" y="245" fill="#777777" font-family="monospace" font-size="11" text-anchor="middle">Distributed Edge Topology · Zero-Cold-Start Lambdas · Deterministic Database Connection Pooling</text>
  </g>
</svg>
