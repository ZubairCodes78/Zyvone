<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0D0D0D"/>
  <rect x="15" y="15" width="770" height="420" rx="12" fill="#141414" stroke="#242424" stroke-width="1.5"/>
  
  <text x="45" y="55" fill="#C8ED35" font-family="monospace" font-size="12" font-weight="bold">WEB INFRASTRUCTURE // 10</text>
  <text x="45" y="85" fill="#F2F1EC" font-family="sans-serif" font-size="20" font-weight="600">Modern Web App Architecture: Next.js App Router &amp; Edge</text>

  <g transform="translate(45, 120)">
    <!-- RSC & Edge Rendering Pipeline -->
    <rect x="0" y="0" width="710" height="110" rx="8" fill="#141824" stroke="#203048"/>
    <text x="35" y="35" fill="#C8ED35" font-family="monospace" font-size="12" font-weight="bold">HYBRID RENDERING LIFECYCLE (SUB-100MS FCP)</text>
    <text x="35" y="65" fill="#F2F1EC" font-family="sans-serif" font-size="13">Edge CDN POP (Cached HTML) → Server Component Streaming (Zero Client JS Bloat)</text>
    <text x="35" y="90" fill="#8EA0BC" font-family="monospace" font-size="11">Partial Prerendering (PPR) + Static Cache Shell + Dynamic Island Hydration</text>

    <!-- 3 Pillars -->
    <rect x="0" y="130" width="220" height="115" rx="8" fill="#161616" stroke="#2D2D2D"/>
    <text x="25" y="160" fill="#F2F1EC" font-family="sans-serif" font-size="13" font-weight="bold">React Server Components</text>
    <text x="25" y="185" fill="#AAAAAA" font-family="sans-serif" font-size="11">Direct database queries</text>
    <text x="25" y="205" fill="#AAAAAA" font-family="sans-serif" font-size="11">0kb client bundle cost</text>
    <text x="25" y="225" fill="#C8ED35" font-family="monospace" font-size="10">SECURITY AT ORIGIN</text>

    <rect x="245" y="130" width="220" height="115" rx="8" fill="#161616" stroke="#2D2D2D"/>
    <text x="270" y="160" fill="#F2F1EC" font-family="sans-serif" font-size="13" font-weight="bold">Edge Compute &amp; Cache</text>
    <text x="270" y="185" fill="#AAAAAA" font-family="sans-serif" font-size="11">Global edge routing</text>
    <text x="270" y="205" fill="#AAAAAA" font-family="sans-serif" font-size="11">Granular revalidateTag</text>
    <text x="270" y="225" fill="#C8ED35" font-family="monospace" font-size="10">SUB-50MS LATENCY</text>

    <rect x="490" y="130" width="220" height="115" rx="8" fill="#152215" stroke="#254425"/>
    <text x="515" y="160" fill="#C8ED35" font-family="sans-serif" font-size="13" font-weight="bold">Core Web Vitals</text>
    <text x="515" y="185" fill="#A0CCA0" font-family="sans-serif" font-size="11">100/100 Lighthouse Performance</text>
    <text x="515" y="205" fill="#A0CCA0" font-family="sans-serif" font-size="11">Zero Cumulative Layout Shift</text>
    <text x="515" y="225" fill="#C8ED35" font-family="monospace" font-size="10">PRODUCTION VALIDATED</text>
  </g>
</svg>
