    <text x="30" y="135" fill="#CCCCCC" font-family="sans-serif" font-size="13">✓ Scheduled batch synchronization</text>
    <text x="30" y="165" fill="#CCCCCC" font-family="sans-serif" font-size="13">✓ Strict mathematical validation</text>
    <text x="30" y="210" fill="#88BBFF" font-family="monospace" font-size="11">Latency: &lt; 20ms | Cost: $0.00001/run</text>

    <!-- Column 2: Agentic Reasoning -->
    <rect x="370" y="0" width="340" height="245" rx="8" fill="#152215" stroke="#254425"/>
    <text x="400" y="40" fill="#C8ED35" font-family="sans-serif" font-size="15" font-weight="bold">Autonomous AI Agents</text>
    <text x="400" y="65" fill="#A0CCA0" font-family="monospace" font-size="11">PROBABILISTIC REASONING LOOPS</text>
    
