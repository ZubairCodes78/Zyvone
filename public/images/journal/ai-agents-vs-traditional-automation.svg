    <text x="400" y="135" fill="#F2F1EC" font-family="sans-serif" font-size="13">✓ Multi-step tool selection &amp; triage</text>
    <text x="400" y="165" fill="#F2F1EC" font-family="sans-serif" font-size="13">✓ Ambiguity resolution &amp; qualification</text>
    <text x="400" y="210" fill="#C8ED35" font-family="monospace" font-size="11">Latency: 800ms - 2s | Contextual Memory</text>
