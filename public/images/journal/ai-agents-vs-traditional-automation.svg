<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0D0D0D"/>
  <rect x="15" y="15" width="770" height="420" rx="12" fill="#141414" stroke="#242424" stroke-width="1.5"/>
  
  <text x="45" y="55" fill="#C8ED35" font-family="monospace" font-size="12" font-weight="bold">INTELLIGENCE ARCHITECTURE // 06</text>
  <text x="45" y="85" fill="#F2F1EC" font-family="sans-serif" font-size="20" font-weight="600">AI Agents vs. Traditional Automation: When to Use LLMs</text>

  <g transform="translate(45, 120)">
    <!-- Column 1: Deterministic Automation -->
    <rect x="0" y="0" width="340" height="245" rx="8" fill="#161616" stroke="#2D2D2D"/>
    <text x="30" y="40" fill="#88BBFF" font-family="sans-serif" font-size="15" font-weight="bold">Deterministic Automation</text>
    <text x="30" y="65" fill="#666666" font-family="monospace" font-size="11">RULE-BASED STATE MACHINES</text>
    
