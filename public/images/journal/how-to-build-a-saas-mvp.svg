<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <rect width="800" height="450" fill="#0D0D0D"/>
  <rect x="15" y="15" width="770" height="420" rx="12" fill="#141414" stroke="#242424" stroke-width="1.5"/>
  
  <text x="45" y="55" fill="#C8ED35" font-family="monospace" font-size="12" font-weight="bold">SAAS ENGINEERING // 05</text>
  <text x="45" y="85" fill="#F2F1EC" font-family="sans-serif" font-size="20" font-weight="600">How to Build a SaaS MVP: Architecture, Stack &amp; Scoping</text>

  <!-- Flow Chart: SaaS Core Blueprint -->
  <g transform="translate(45, 120)">
    <!-- Phase 1: Auth & Multi-Tenancy -->
    <rect x="0" y="0" width="215" height="110" rx="8" fill="#1A1A1A" stroke="#333333"/>
    <text x="107" y="35" fill="#F2F1EC" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">01 // Multi-Tenant Core</text>
    <text x="107" y="60" fill="#C8ED35" font-family="monospace" font-size="11" text-anchor="middle">Row-Level Security (RLS)</text>
    <text x="107" y="82" fill="#888888" font-family="monospace" font-size="10" text-anchor="middle">Organization ID Isolation</text>

    <line x1="215" y1="55" x2="250" y2="55" stroke="#C8ED35" stroke-width="2"/>

    <!-- Phase 2: Billing & Subscriptions -->
    <rect x="250" y="0" width="215" height="110" rx="8" fill="#1A1A1A" stroke="#333333"/>
    <text x="357" y="35" fill="#F2F1EC" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="600">02 // Monetization Hook</text>
    <text x="357" y="60" fill="#C8ED35" font-family="monospace" font-size="11" text-anchor="middle">Stripe Webhooks &amp; Usage</text>
    <text x="357" y="82" fill="#888888" font-family="monospace" font-size="10" text-anchor="middle">Customer Portal Sync</text>

    <line x1="465" y1="55" x2="500" y2="55" stroke="#C8ED35" stroke-width="2"/>

    <!-- Phase 3: Core Value Loop -->
    <rect x="500" y="0" width="210" height="110" rx="8" fill="#152215" stroke="#254425"/>
    <text x="605" y="35" fill="#C8ED35" font-family="sans-serif" font-size="13" text-anchor="middle" font-weight="bold">03 // Single Value Loop</text>
    <text x="605" y="60" fill="#A0CCA0" font-family="monospace" font-size="11" text-anchor="middle">Deterministic Execution</text>
    <text x="605" y="82" fill="#709970" font-family="monospace" font-size="10" text-anchor="middle">Zero Feature Bloat</text>

    <!-- Bottom Architecture Metrics -->
    <rect x="0" y="145" width="710" height="100" rx="8" fill="#141824" stroke="#203048"/>
    <text x="35" y="180" fill="#C8ED35" font-family="monospace" font-size="11" font-weight="bold">TECH STACK ARCHITECTURE // 2026</text>
    <text x="35" y="210" fill="#F2F1EC" font-family="sans-serif" font-size="13">Next.js App Router (RSC) · TypeScript · Supabase PostgreSQL · Stripe · Tailwind CSS</text>
    <text x="35" y="230" fill="#8EA0BC" font-family="monospace" font-size="11">Production Scoping: 4-6 Weeks to Launch · Zero Microservice Overhead</text>
  </g>
</svg>
