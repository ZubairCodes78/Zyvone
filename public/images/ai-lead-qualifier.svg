<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#060B18;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4F53C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4F53C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="rgba(212,245,60,0.06)" stroke-width="1"/>
    </pattern>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112040" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09132A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#060B18"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="600" cy="337" r="450" fill="url(#bg-glow)"/>

  <!-- Top System Header -->
  <rect x="80" y="50" width="1040" height="60" rx="12" fill="#0D1B4B" stroke="rgba(212,245,60,0.25)" stroke-width="1"/>
  <circle cx="120" cy="80" r="6" fill="#D4F53C"/>
  <text x="140" y="85" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="1">ZYVONE // AI LEAD QUALIFIER &amp; INTENT ENGINE</text>
  <rect x="910" y="65" width="180" height="30" rx="15" fill="rgba(212,245,60,0.15)" stroke="#D4F53C" stroke-width="1"/>
  <text x="1000" y="85" fill="#D4F53C" font-size="12" font-weight="700" text-anchor="middle">SCORING ACTIVE · 2026</text>

  <!-- Left: Real-time Lead Scoring Card -->
  <g transform="translate(80, 140)">
    <rect width="500" height="480" rx="14" fill="url(#card-grad)" stroke="rgba(212,245,60,0.3)" stroke-width="1.2"/>
    <rect x="24" y="24" width="452" height="40" rx="8" fill="#0D1B4B"/>
    <text x="44" y="49" fill="#D4F53C" font-size="13" font-weight="700">INCOMING LEAD // INTAKE &amp; ANALYSIS</text>

    <!-- Lead Profile -->
    <text x="34" y="100" fill="#FFFFFF" font-size="16" font-weight="700">Enterprise Logistics Co. (Dubai)</text>
    <text x="34" y="122" fill="rgba(255,255,255,0.6)" font-size="12">Source: Inbound Web Form · Budget: $25K–$50K</text>

    <!-- Score Circle Gauge -->
    <circle cx="110" cy="220" r="55" fill="#060B18" stroke="#0D1B4B" stroke-width="8"/>
    <circle cx="110" cy="220" r="55" fill="none" stroke="#D4F53C" stroke-width="8" stroke-dasharray="320" stroke-dashoffset="40" stroke-linecap="round"/>
    <text x="110" y="222" fill="#D4F53C" font-size="28" font-weight="800" text-anchor="middle">92</text>
    <text x="110" y="242" fill="rgba(255,255,255,0.6)" font-size="10" text-anchor="middle">LEAD SCORE</text>

    <!-- Intent Signals -->
    <rect x="195" y="165" width="280" height="28" rx="6" fill="rgba(34,197,94,0.15)" stroke="rgba(34,197,94,0.4)" stroke-width="0.8"/>
    <text x="210" y="183" fill="#22c55e" font-size="11" font-weight="700">✓ HIGH BUYING INTENT (96% Confidence)</text>

    <rect x="195" y="202" width="280" height="28" rx="6" fill="rgba(212,245,60,0.1)" stroke="rgba(212,245,60,0.3)" stroke-width="0.8"/>
    <text x="210" y="220" fill="#D4F53C" font-size="11">Decision Maker: Chief Operating Officer</text>

    <rect x="195" y="239" width="280" height="28" rx="6" fill="rgba(255,255,255,0.05)" stroke="rgba(255,255,255,0.15)" stroke-width="0.8"/>
    <text x="210" y="257" fill="rgba(255,255,255,0.7)" font-size="11">Timeline: Immediate Q2 Deployment</text>

    <!-- Factor Breakdown -->
    <line x1="24" y1="295" x2="476" y2="295" stroke="rgba(212,245,60,0.15)" stroke-width="1"/>
    <text x="34" y="325" fill="#FFFFFF" font-size="13" font-weight="700">QUALIFICATION SIGNALS</text>

    <text x="34" y="360" fill="rgba(255,255,255,0.7)" font-size="12">Problem Fit: Custom Logistics Automation</text>
    <rect x="34" y="370" width="430" height="6" rx="3" fill="#0D1B4B"/>
    <rect x="34" y="370" width="410" height="6" rx="3" fill="#D4F53C"/>

    <text x="34" y="410" fill="rgba(255,255,255,0.7)" font-size="12">Budget Verification: Verified Above Threshold</text>
    <rect x="34" y="420" width="430" height="6" rx="3" fill="#0D1B4B"/>
    <rect x="34" y="420" width="380" height="6" rx="3" fill="#22c55e"/>

    <text x="34" y="455" fill="rgba(255,255,255,0.7)" font-size="12">Readiness / Velocity: High Priority Fast Track</text>
    <rect x="34" y="465" width="430" height="6" rx="3" fill="#0D1B4B"/>
    <rect x="34" y="465" width="420" height="6" rx="3" fill="#D4F53C"/>
  </g>

  <!-- Right: Workflow Execution & Routing -->
  <g transform="translate(620, 140)">
    <rect width="500" height="480" rx="14" fill="url(#card-grad)" stroke="rgba(212,245,60,0.3)" stroke-width="1.2"/>
    <rect x="24" y="24" width="452" height="40" rx="8" fill="#0D1B4B"/>
    <text x="44" y="49" fill="#D4F53C" font-size="13" font-weight="700">MULTI-STAGE DECISION WORKFLOW</text>

    <!-- Step 1 -->
    <rect x="24" y="85" width="452" height="60" rx="8" fill="#081024" stroke="rgba(212,245,60,0.2)" stroke-width="1"/>
    <circle cx="55" cy="115" r="14" fill="#D4F53C"/>
    <text x="55" y="120" fill="#060B18" font-size="12" font-weight="800" text-anchor="middle">1</text>
    <text x="85" y="108" fill="#FFFFFF" font-size="13" font-weight="700">NEW LEAD INTAKE</text>
    <text x="85" y="126" fill="rgba(255,255,255,0.6)" font-size="11">Captures contact details, inquiry message &amp; requirements</text>

    <!-- Step 2 -->
    <rect x="24" y="160" width="452" height="60" rx="8" fill="#081024" stroke="rgba(212,245,60,0.2)" stroke-width="1"/>
    <circle cx="55" cy="190" r="14" fill="#D4F53C"/>
    <text x="55" y="195" fill="#060B18" font-size="12" font-weight="800" text-anchor="middle">2</text>
    <text x="85" y="183" fill="#FFFFFF" font-size="13" font-weight="700">AI INTENT EXTRACTION</text>
    <text x="85" y="201" fill="rgba(255,255,255,0.6)" font-size="11">NLP semantic extraction: extracts budget, urgencies, scope</text>

    <!-- Step 3 -->
    <rect x="24" y="235" width="452" height="60" rx="8" fill="#081024" stroke="rgba(212,245,60,0.2)" stroke-width="1"/>
    <circle cx="55" cy="265" r="14" fill="#D4F53C"/>
    <text x="55" y="270" fill="#060B18" font-size="12" font-weight="800" text-anchor="middle">3</text>
    <text x="85" y="258" fill="#FFFFFF" font-size="13" font-weight="700">LEAD SCORING &amp; CATEGORIZATION</text>
    <text x="85" y="276" fill="rgba(255,255,255,0.6)" font-size="11">Calculates 0–100 composite readiness &amp; value score</text>

    <!-- Step 4 -->
    <rect x="24" y="310" width="452" height="60" rx="8" fill="#081024" stroke="#D4F53C" stroke-width="1.4"/>
    <circle cx="55" cy="340" r="14" fill="#22c55e"/>
    <text x="55" y="345" fill="#060B18" font-size="12" font-weight="800" text-anchor="middle">4</text>
    <text x="85" y="333" fill="#D4F53C" font-size="13" font-weight="700">AUTOMATED SALES ACTION TRIGGERED</text>
    <text x="85" y="351" fill="rgba(255,255,255,0.7)" font-size="11">Calendar invite dispatched + Senior Engineer notified (Slack/WhatsApp)</text>

    <!-- Output Banner -->
    <rect x="24" y="395" width="452" height="60" rx="8" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1"/>
    <text x="44" y="420" fill="#22c55e" font-size="13" font-weight="700">✓ STATUS: QUALIFIED FOR IMMEDIATE CONSULTATION</text>
    <text x="44" y="440" fill="rgba(255,255,255,0.7)" font-size="11">Response time: 42 seconds · Zero manual sales sorting required</text>
  </g>
</svg>
