<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#060B18;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4F53C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4F53C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="rgba(212,245,60,0.06)" stroke-width="1"/>
    </pattern>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112040" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09132A" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="accent-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4F53C"/>
      <stop offset="100%" stop-color="#22c55e"/>
    </linearGradient>
  </defs>

  <!-- Grid & Glow -->
  <rect width="1200" height="675" fill="#060B18"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="600" cy="337" r="450" fill="url(#bg-glow)"/>

  <!-- Top System Header -->
  <rect x="80" y="50" width="1040" height="60" rx="12" fill="#0D1B4B" stroke="rgba(212,245,60,0.25)" stroke-width="1"/>
  <circle cx="120" cy="80" r="6" fill="#22c55e"/>
  <text x="140" y="85" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="1">ZYVONE // WHATSAPP AUTOMATION PIPELINE</text>
  <rect x="940" y="65" width="150" height="30" rx="15" fill="rgba(212,245,60,0.15)" stroke="#D4F53C" stroke-width="1"/>
  <text x="1015" y="85" fill="#D4F53C" font-size="12" font-weight="700" text-anchor="middle">EVENT ENGINE · 2026</text>

  <!-- Flow Connector Line -->
  <line x1="160" y1="260" x2="1040" y2="260" stroke="#D4F53C" stroke-width="2" stroke-dasharray="6 6" opacity="0.4"/>

  <!-- Node 1: TRIGGER -->
  <g transform="translate(80, 180)">
    <rect width="180" height="160" rx="12" fill="url(#card-grad)" stroke="#D4F53C" stroke-width="1.2"/>
    <rect x="16" y="16" width="70" height="22" rx="4" fill="rgba(212,245,60,0.15)"/>
    <text x="51" y="32" fill="#D4F53C" font-size="11" font-weight="700" text-anchor="middle">STAGE 01</text>
    <text x="16" y="68" fill="#FFFFFF" font-size="18" font-weight="700">TRIGGER</text>
    <text x="16" y="96" fill="rgba(255,255,255,0.6)" font-size="12">Order Placed</text>
    <text x="16" y="116" fill="rgba(255,255,255,0.6)" font-size="12">Lead Inbound</text>
    <text x="16" y="136" fill="#D4F53C" font-size="11">Webhook Event</text>
  </g>

  <!-- Arrow 1 -->
  <polygon points="280,255 295,260 280,265" fill="#D4F53C"/>

  <!-- Node 2: BUSINESS EVENT -->
  <g transform="translate(310, 180)">
    <rect width="180" height="160" rx="12" fill="url(#card-grad)" stroke="rgba(212,245,60,0.3)" stroke-width="1"/>
    <rect x="16" y="16" width="70" height="22" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="51" y="32" fill="rgba(255,255,255,0.7)" font-size="11" font-weight="700" text-anchor="middle">STAGE 02</text>
    <text x="16" y="68" fill="#FFFFFF" font-size="18" font-weight="700">EVENT VALID</text>
    <text x="16" y="96" fill="rgba(255,255,255,0.6)" font-size="12">Schema Verification</text>
    <text x="16" y="116" fill="rgba(255,255,255,0.6)" font-size="12">Rate Limit Check</text>
    <text x="16" y="136" fill="#22c55e" font-size="11">Payload: 200 OK</text>
  </g>

  <!-- Arrow 2 -->
  <polygon points="510,255 525,260 510,265" fill="#D4F53C"/>

  <!-- Node 3: AUTOMATION ENGINE -->
  <g transform="translate(540, 180)">
    <rect width="180" height="160" rx="12" fill="url(#card-grad)" stroke="#D4F53C" stroke-width="1.5"/>
    <rect x="16" y="16" width="70" height="22" rx="4" fill="rgba(212,245,60,0.2)"/>
    <text x="51" y="32" fill="#D4F53C" font-size="11" font-weight="700" text-anchor="middle">STAGE 03</text>
    <text x="16" y="68" fill="#FFFFFF" font-size="18" font-weight="700">AUTOMATION</text>
    <text x="16" y="96" fill="rgba(255,255,255,0.6)" font-size="12">Template Routing</text>
    <text x="16" y="116" fill="rgba(255,255,255,0.6)" font-size="12">Variable Hydration</text>
    <text x="16" y="136" fill="#D4F53C" font-size="11">Queue: Dispatched</text>
  </g>

  <!-- Arrow 3 -->
  <polygon points="740,255 755,260 740,265" fill="#D4F53C"/>

  <!-- Node 4: WHATSAPP CLOUD API -->
  <g transform="translate(770, 180)">
    <rect width="180" height="160" rx="12" fill="url(#card-grad)" stroke="rgba(212,245,60,0.3)" stroke-width="1"/>
    <rect x="16" y="16" width="70" height="22" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="51" y="32" fill="rgba(255,255,255,0.7)" font-size="11" font-weight="700" text-anchor="middle">STAGE 04</text>
    <text x="16" y="68" fill="#FFFFFF" font-size="18" font-weight="700">WHATSAPP</text>
    <text x="16" y="96" fill="rgba(255,255,255,0.6)" font-size="12">Meta Cloud API</text>
    <text x="16" y="116" fill="rgba(255,255,255,0.6)" font-size="12">HSM Template</text>
    <text x="16" y="136" fill="#22c55e" font-size="11">Status: Delivered</text>
  </g>

  <!-- Arrow 4 -->
  <polygon points="970,255 985,260 970,265" fill="#D4F53C"/>

  <!-- Node 5: CUSTOMER RESPONSE -->
  <g transform="translate(1000, 180)">
    <rect width="120" height="160" rx="12" fill="url(#card-grad)" stroke="rgba(212,245,60,0.3)" stroke-width="1"/>
    <rect x="12" y="16" width="60" height="22" rx="4" fill="rgba(255,255,255,0.08)"/>
    <text x="42" y="32" fill="rgba(255,255,255,0.7)" font-size="10" font-weight="700" text-anchor="middle">STAGE 05</text>
    <text x="12" y="68" fill="#FFFFFF" font-size="15" font-weight="700">RESPONSE</text>
    <text x="12" y="96" fill="rgba(255,255,255,0.6)" font-size="11">Button Tap</text>
    <text x="12" y="116" fill="rgba(255,255,255,0.6)" font-size="11">Confirmation</text>
    <text x="12" y="136" fill="#D4F53C" font-size="11">Sync CRM</text>
  </g>

  <!-- Bottom Terminal & Telemetry Panel -->
  <rect x="80" y="380" width="1040" height="240" rx="12" fill="#081024" stroke="rgba(212,245,60,0.18)" stroke-width="1"/>
  
  <!-- Terminal Header -->
  <rect x="80" y="380" width="1040" height="40" rx="12" fill="#0D1B4B"/>
  <circle cx="106" cy="400" r="4.5" fill="#ef4444"/>
  <circle cx="122" cy="400" r="4.5" fill="#f59e0b"/>
  <circle cx="138" cy="400" r="4.5" fill="#22c55e"/>
  <text x="160" y="405" fill="rgba(255,255,255,0.5)" font-size="12">system-events.log — live telemetry stream</text>
  
  <!-- Telemetry Content -->
  <text x="110" y="450" fill="#22c55e" font-size="13">[2026-03-09T14:22:01Z] [TRIGGER_INGEST] Order #4109 created → Dispatched to queue (latency: 18ms)</text>
  <text x="110" y="480" fill="#D4F53C" font-size="13">[2026-03-09T14:22:02Z] [TEMPLATE_HYDRATE] Customer: +92 300 *** · Order confirmation HSM template loaded</text>
  <text x="110" y="510" fill="#FFFFFF" font-size="13">[2026-03-09T14:22:03Z] [META_API_SEND] Message ID: wamid.HBgLM... delivered via WhatsApp Cloud API</text>
  <text x="110" y="540" fill="rgba(255,255,255,0.6)" font-size="13">[2026-03-09T14:22:15Z] [INBOUND_WEBHOOK] Customer confirmed: "CONFIRM ORDER" button click received</text>
  <text x="110" y="570" fill="#22c55e" font-size="13">[2026-03-09T14:22:16Z] [SYSTEM_ACTION] Database status updated to "DISPATCH_CONFIRMED" · 0 manual intervention</text>

  <!-- Live Status Pill -->
  <rect x="910" y="560" width="180" height="34" rx="17" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1"/>
  <circle cx="930" cy="577" r="4" fill="#22c55e"/>
  <text x="945" y="582" fill="#22c55e" font-size="12" font-weight="700">PIPELINE HEALTHY</text>
</svg>
