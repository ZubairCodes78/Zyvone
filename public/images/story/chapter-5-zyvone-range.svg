    <text x="25" y="73" fill="#F2F1EC" font-family="sans-serif" font-size="12" font-weight="500">Patient Records &amp; Automated Scheduling</text>
    <text x="320" y="73" fill="#C8ED35" font-family="monospace" font-size="11" text-anchor="end">SYNCED</text>

    <rect x="15" y="100" width="150" height="58" rx="6" fill="#111111" stroke="#262626"/>
    <text x="25" y="120" fill="#888888" font-family="monospace" font-size="10">PATIENTS</text>
    <text x="25" y="144" fill="#61AFEF" font-family="sans-serif" font-size="16" font-weight="bold">1,200+</text>

    <rect x="180" y="100" width="150" height="58" rx="6" fill="#111111" stroke="#262626"/>
    <text x="190" y="120" fill="#888888" font-family="monospace" font-size="10">NO-SHOW RATE</text>
    <text x="190" y="144" fill="#C8ED35" font-family="sans-serif" font-size="16" font-weight="bold">-82%</text>
  </g>

  <!-- Tile 3: Industrial Infrastructure (Al Raheem Engineering) -->
  <g transform="translate(40, 280)">
    <rect width="345" height="175" rx="8" fill="#181818" stroke="#2A2A2A" stroke-width="1.5"/>
