    <text x="190" y="120" fill="#888888" font-family="monospace" font-size="10">RFQ PIPELINE</text>
    <text x="190" y="144" fill="#C8ED35" font-family="sans-serif" font-size="16" font-weight="bold">Instant Quote</text>
  </g>

  <!-- Tile 4: Digital Commerce Engine (WearOmnia) -->
  <g transform="translate(415, 280)">
    <rect width="345" height="175" rx="8" fill="#181818" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect width="345" height="34" rx="8" fill="#1E1E1E"/>
    <circle cx="20" cy="17" r="4" fill="#E06C75"/>
    <text x="32" y="21" fill="#F2F1EC" font-family="sans-serif" font-size="12" font-weight="600">WearOmnia · Headless Commerce</text>
