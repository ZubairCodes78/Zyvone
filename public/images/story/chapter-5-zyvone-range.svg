  <!-- 4-Quadrant Multi-Project Showcase Grid -->

  <!-- Tile 1: AI & Platform (Toolmatic) -->
  <g transform="translate(40, 90)">
    <rect width="345" height="175" rx="8" fill="#181818" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect width="345" height="34" rx="8" fill="#1E1E1E"/>
    <circle cx="20" cy="17" r="4" fill="#C8ED35"/>
    <text x="32" y="21" fill="#F2F1EC" font-family="sans-serif" font-size="12" font-weight="600">Toolmatic · AI Workflow Engine</text>
    <text x="330" y="21" fill="#888888" font-family="monospace" font-size="10" text-anchor="end">SAAS PLATFORM</text>
    
    <!-- Mini UI elements -->
    <rect x="15" y="48" width="180" height="32" rx="4" fill="#111111" stroke="#262626"/>
    <text x="25" y="68" fill="#C8ED35" font-family="monospace" font-size="11">AI Agent Pipeline → Active</text>

    <rect x="205" y="48" width="125" height="32" rx="4" fill="#111111" stroke="#262626"/>
    <text x="215" y="68" fill="#90B090" font-family="monospace" font-size="11">Latency: 12ms</text>

    <rect x="15" y="90" width="315" height="68" rx="6" fill="#121812" stroke="#254425"/>
    <text x="25" y="112" fill="#888888" font-family="monospace" font-size="10">AUTOMATION METRICS</text>
    <text x="25" y="136" fill="#C8ED35" font-family="sans-serif" font-size="17" font-weight="bold">1.4M Requests Processed</text>
    <text x="250" y="136" fill="#88BB88" font-family="monospace" font-size="11">99.99% Uptime</text>
  </g>

  <!-- Tile 2: Healthcare Systems (Cantt Dental Care) -->
  <g transform="translate(415, 90)">
    <rect width="345" height="175" rx="8" fill="#181818" stroke="#2A2A2A" stroke-width="1.5"/>
    <rect width="345" height="34" rx="8" fill="#1E1E1E"/>
    <circle cx="20" cy="17" r="4" fill="#61AFEF"/>
    <text x="32" y="21" fill="#F2F1EC" font-family="sans-serif" font-size="12" font-weight="600">Cantt Dental Care · Healthcare OS</text>
    <text x="330" y="21" fill="#888888" font-family="monospace" font-size="10" text-anchor="end">HEALTHCARE</text>
    
    <!-- Mini UI elements -->
