    <text x="25" y="120" fill="#888888" font-family="monospace" font-size="10">CHECKOUT SPEED</text>
    <text x="25" y="144" fill="#C8ED35" font-family="sans-serif" font-size="16" font-weight="bold">1.2s Global</text>

    <rect x="180" y="100" width="150" height="58" rx="6" fill="#111111" stroke="#262626"/>
    <text x="190" y="120" fill="#888888" font-family="monospace" font-size="10">ARCHITECTURE</text>
    <text x="190" y="144" fill="#F2F1EC" font-family="sans-serif" font-size="16" font-weight="bold">Edge Engine</text>
