    <rect x="16" y="175" width="348" height="65" rx="6" fill="#081024" stroke="rgba(212,245,60,0.15)" stroke-width="1"/>
    <text x="28" y="196" fill="#D4F53C" font-size="11" font-weight="700">FINDING 1: High Inbound Manual Tax</text>
    <text x="28" y="214" fill="rgba(255,255,255,0.8)" font-size="11">73% of Pakistani manufacturing SMEs spend 3+ hrs/day</text>
    <text x="28" y="230" fill="rgba(255,255,255,0.8)" font-size="11">manually reconciling WhatsApp orders with Excel.</text>

    <rect x="16" y="250" width="348" height="65" rx="6" fill="#081024" stroke="rgba(212,245,60,0.15)" stroke-width="1"/>
    <text x="28" y="271" fill="#D4F53C" font-size="11" font-weight="700">FINDING 2: Sub-45-Day Payback Horizon</text>
    <text x="28" y="289" fill="rgba(255,255,255,0.8)" font-size="11">Deterministic AI workflow implementation delivers</text>
    <text x="28" y="305" fill="rgba(255,255,255,0.8)" font-size="11">full operational cost recovery in 38 to 44 calendar days.</text>

    <rect x="16" y="325" width="348" height="90" rx="6" fill="#081024" stroke="#22c55e" stroke-width="1"/>
    <text x="28" y="346" fill="#22c55e" font-size="11" font-weight="700">FINDING 3: Low-Code Fragility Risk</text>
    <text x="28" y="364" fill="rgba(255,255,255,0.8)" font-size="11">SMEs using fragile no-code zap connectors suffer</text>
    <text x="28" y="380" fill="rgba(255,255,255,0.8)" font-size="11">14% failure rate. Hardened code pipelines required.</text>
    <text x="28" y="400" fill="#22c55e" font-size="10">→ Strongly favors ZYVONE custom engineering</text>
  </g>

  <!-- Col 3: Strategic Recommendations & Report (Width: 280) -->
  <g transform="translate(820, 195)">
    <rect width="300" height="435" rx="12" fill="url(#card-grad)" stroke="#D4F53C" stroke-width="1.4"/>
    <rect x="16" y="16" width="268" height="32" rx="6" fill="#081024"/>
    <text x="26" y="37" fill="#D4F53C" font-size="11" font-weight="700">DECISION REPORT // OUTPUT</text>

    <text x="20" y="75" fill="#FFFFFF" font-size="14" font-weight="700">STRATEGIC VERDICT</text>
    
    <rect x="16" y="90" width="268" height="40" rx="6" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1"/>
    <text x="26" y="115" fill="#22c55e" font-size="12" font-weight="800">RECOMMENDATION: PROCEED</text>

    <text x="20" y="155" fill="rgba(255,255,255,0.6)" font-size="11">EXECUTIVE ACTIONS:</text>
    
    <text x="20" y="180" fill="#FFFFFF" font-size="11" font-weight="600">1. Target Logistics &amp; Textiles</text>
    <text x="20" y="196" fill="rgba(255,255,255,0.7)" font-size="10">Highest manual transaction volume.</text>

    <text x="20" y="225" fill="#FFFFFF" font-size="11" font-weight="600">2. Deploy WhatsApp + PostgreSQL</text>
    <text x="20" y="241" fill="rgba(255,255,255,0.7)" font-size="10">Zero user training overhead required.</text>

    <text x="20" y="270" fill="#FFFFFF" font-size="11" font-weight="600">3. Offer 30-Day Payback SLA</text>
    <text x="20" y="286" fill="rgba(255,255,255,0.7)" font-size="10">Irresistible commercial framing.</text>

    <!-- Report Download Action Box -->
    <rect x="16" y="325" width="268" height="90" rx="8" fill="#081024" stroke="#D4F53C" stroke-width="1"/>
    <rect x="30" y="340" width="240" height="34" rx="6" fill="#D4F53C"/>
    <text x="150" y="362" fill="#060B18" font-size="12" font-weight="800" text-anchor="middle">EXPORT DECISION BRIEF</text>
    <text x="150" y="395" fill="rgba(255,255,255,0.5)" font-size="10" text-anchor="middle">Structured Markdown &amp; JSON ready</text>
  </g>
</svg>
