      <text x="120" y="52" fill="#22c55e" font-size="11">✓ Multi-source corroborated</text>
      <text x="120" y="68" fill="rgba(255,255,255,0.5)" font-size="10">0 unverified claims permitted</text>
    </g>

    <!-- Findings Cards -->
