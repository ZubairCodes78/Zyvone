<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675" style="background:#060B18;font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace">
  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#D4F53C" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#D4F53C" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0L0 0 0 40" fill="none" stroke="rgba(212,245,60,0.06)" stroke-width="1"/>
    </pattern>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#112040" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#09132A" stop-opacity="0.9"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="675" fill="#060B18"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="600" cy="337" r="450" fill="url(#bg-glow)"/>

  <!-- Top System Header -->
  <rect x="80" y="50" width="1040" height="60" rx="12" fill="#0D1B4B" stroke="rgba(212,245,60,0.25)" stroke-width="1"/>
  <circle cx="120" cy="80" r="6" fill="#D4F53C"/>
  <text x="140" y="85" fill="#FFFFFF" font-size="16" font-weight="700" letter-spacing="1">ZYVONE // AUTOMATED CONTENT PRODUCTION PIPELINE</text>
  <rect x="910" y="65" width="180" height="30" rx="15" fill="rgba(212,245,60,0.15)" stroke="#D4F53C" stroke-width="1"/>
  <text x="1000" y="85" fill="#D4F53C" font-size="12" font-weight="700" text-anchor="middle">WORKFLOW ACTIVE · 2026</text>

  <!-- Flow Sequence Headers (5 Steps) -->
  <g transform="translate(80, 135)">
    <!-- Step 1: IDEA -->
    <rect x="0" y="0" width="190" height="70" rx="8" fill="#0D1B4B" stroke="rgba(212,245,60,0.4)" stroke-width="1"/>
    <text x="20" y="28" fill="#D4F53C" font-size="11" font-weight="700">STAGE 01 // INPUT</text>
    <text x="20" y="52" fill="#FFFFFF" font-size="16" font-weight="700">CORE IDEA</text>

    <!-- Step 2: AI GENERATION -->
    <rect x="212" y="0" width="190" height="70" rx="8" fill="#0D1B4B" stroke="#D4F53C" stroke-width="1.4"/>
    <text x="232" y="28" fill="#D4F53C" font-size="11" font-weight="700">STAGE 02 // ENGINE</text>
    <text x="232" y="52" fill="#FFFFFF" font-size="16" font-weight="700">AI GENERATION</text>

    <!-- Step 3: VARIATIONS -->
    <rect x="424" y="0" width="190" height="70" rx="8" fill="#0D1B4B" stroke="rgba(212,245,60,0.4)" stroke-width="1"/>
    <text x="444" y="28" fill="#D4F53C" font-size="11" font-weight="700">STAGE 03 // FORMAT</text>
    <text x="444" y="52" fill="#FFFFFF" font-size="16" font-weight="700">VARIATIONS</text>

    <!-- Step 4: REVIEW -->
    <rect x="636" y="0" width="190" height="70" rx="8" fill="#0D1B4B" stroke="rgba(212,245,60,0.4)" stroke-width="1"/>
    <text x="656" y="28" fill="#D4F53C" font-size="11" font-weight="700">STAGE 04 // AUDIT</text>
    <text x="656" y="52" fill="#FFFFFF" font-size="16" font-weight="700">BRAND REVIEW</text>

    <!-- Step 5: READY -->
    <rect x="848" y="0" width="192" height="70" rx="8" fill="rgba(34,197,94,0.15)" stroke="#22c55e" stroke-width="1.4"/>
    <text x="868" y="28" fill="#22c55e" font-size="11" font-weight="700">STAGE 05 // DEPLOY</text>
    <text x="868" y="52" fill="#FFFFFF" font-size="16" font-weight="700">READY TO PUBLISH</text>
  </g>

  <!-- Lower Split: Input Workbench vs Output Channels -->
  <!-- Left: Structured Input Card -->
  <g transform="translate(80, 230)">
    <rect width="450" height="390" rx="12" fill="url(#card-grad)" stroke="rgba(212,245,60,0.25)" stroke-width="1"/>
    <rect x="20" y="20" width="410" height="36" rx="6" fill="#081024"/>
    <text x="35" y="44" fill="#D4F53C" font-size="12" font-weight="700">STRUCTURED CONTENT BRIEF &amp; TONE</text>

    <text x="25" y="90" fill="rgba(255,255,255,0.5)" font-size="11">TOPIC OBJECTIVE</text>
    <text x="25" y="115" fill="#FFFFFF" font-size="14" font-weight="600">Enterprise AI automation ROI in Pakistan SMEs</text>

    <text x="25" y="160" fill="rgba(255,255,255,0.5)" font-size="11">BRAND VOICE DIRECTIVE</text>
    <rect x="25" y="175" width="400" height="30" rx="6" fill="#081024"/>
    <text x="38" y="195" fill="#D4F53C" font-size="12">Direct, technical, zero fluff, production-oriented</text>

    <text x="25" y="240" fill="rgba(255,255,255,0.5)" font-size="11">TARGET CHANNELS</text>
    <rect x="25" y="255" width="120" height="26" rx="4" fill="rgba(212,245,60,0.15)"/>
    <text x="85" y="272" fill="#D4F53C" font-size="11" text-anchor="middle">LinkedIn Long-Form</text>
    <rect x="155" y="255" width="110" height="26" rx="4" fill="rgba(212,245,60,0.15)"/>
    <text x="210" y="272" fill="#D4F53C" font-size="11" text-anchor="middle">X Thread (8 posts)</text>
    <rect x="275" y="255" width="120" height="26" rx="4" fill="rgba(212,245,60,0.15)"/>
    <text x="335" y="272" fill="#D4F53C" font-size="11" text-anchor="middle">Newsletter Edition</text>

    <!-- Execution Status -->
    <rect x="25" y="315" width="400" height="50" rx="8" fill="rgba(34,197,94,0.12)" stroke="#22c55e" stroke-width="0.8"/>
    <circle cx="45" cy="340" r="4" fill="#22c55e"/>
    <text x="60" y="338" fill="#22c55e" font-size="12" font-weight="700">PIPELINE EXECUTION: 100% SUCCESS</text>
    <text x="60" y="354" fill="rgba(255,255,255,0.7)" font-size="11">3 channel variants formatted with zero hallucinations</text>
  </g>

  <!-- Right: Generated Channel Variations Panel -->
  <g transform="translate(560, 230)">
    <rect width="560" height="390" rx="12" fill="url(#card-grad)" stroke="rgba(212,245,60,0.25)" stroke-width="1"/>
    <rect x="20" y="20" width="520" height="36" rx="6" fill="#081024"/>
    <text x="35" y="44" fill="#D4F53C" font-size="12" font-weight="700">MULTI-CHANNEL OUTPUT VARIATIONS</text>

    <!-- Variant 1: LinkedIn -->
    <rect x="20" y="70" width="520" height="85" rx="8" fill="#081024" stroke="rgba(212,245,60,0.15)" stroke-width="1"/>
    <text x="35" y="94" fill="#D4F53C" font-size="12" font-weight="700">LINKEDIN POST // B2B THOUGHT LEADERSHIP</text>
    <text x="35" y="116" fill="rgba(255,255,255,0.85)" font-size="12">"Most businesses don’t have a software problem. They have a manual workflow tax..."</text>
    <text x="35" y="136" fill="rgba(255,255,255,0.5)" font-size="10">Word count: 284 words · Hashtags: #AIAutomation #Engineering #SME</text>

    <!-- Variant 2: X Thread -->
    <rect x="20" y="165" width="520" height="85" rx="8" fill="#081024" stroke="rgba(212,245,60,0.15)" stroke-width="1"/>
    <text x="35" y="189" fill="#D4F53C" font-size="12" font-weight="700">X THREAD // 6 HOOK-DRIVEN POSTS</text>
    <text x="35" y="211" fill="rgba(255,255,255,0.85)" font-size="12">"1/6 How a Lahore factory saved 22 hours weekly by connecting WhatsApp to Postgres 🧵"</text>
    <text x="35" y="231" fill="rgba(255,255,255,0.5)" font-size="10">Character count: 268/280 · Engagement hook optimized</text>

    <!-- Variant 3: Newsletter -->
    <rect x="20" y="260" width="520" height="110" rx="8" fill="#081024" stroke="#22c55e" stroke-width="1"/>
    <text x="35" y="284" fill="#22c55e" font-size="12" font-weight="700">EXECUTIVE BRIEF // EMAIL BROADCAST</text>
    <text x="35" y="306" fill="rgba(255,255,255,0.85)" font-size="12">Subject: "The true cost of manual data entry in 2026 operations"</text>
    <text x="35" y="328" fill="rgba(255,255,255,0.65)" font-size="11">Clear CTA: "Read technical case study" → UTM tracking parameters auto-injected</text>
    <rect x="35" y="342" width="130" height="20" rx="4" fill="rgba(34,197,94,0.2)"/>
    <text x="100" y="356" fill="#22c55e" font-size="10" text-anchor="middle">APPROVED FOR DISPATCH</text>
  </g>
</svg>
